<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>多人點餐系統</title>
    <style>
      :root {
        --ink: #17211b;
        --muted: #66726d;
        --line: #dce3de;
        --paper: #f8faf6;
        --panel: #ffffff;
        --mint: #d7efe2;
        --mint-strong: #289365;
        --coral: #e86f51;
        --gold: #f5c85b;
        --blue: #427aa1;
        --shadow: 0 20px 50px rgba(24, 38, 31, 0.16);
      }

      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #eef5ef 0%, #f7f5ee 48%, #e7f1f6 100%);
        color: var(--ink);
        font-family: "Segoe UI", "Noto Sans TC", Arial, sans-serif;
      }
      button, input, select { font: inherit; }
      button { cursor: pointer; }
      h1, h2, h3, p { margin-top: 0; }
      h1 { margin-bottom: 0; font-size: 28px; line-height: 1.05; }
      h2 { margin-bottom: 0; font-size: 21px; }
      h3 { margin-bottom: 12px; font-size: 16px; }

      .phone-shell {
        width: min(430px, 100vw);
        min-height: min(920px, 100vh);
        background: var(--paper);
        border: 1px solid rgba(23, 33, 27, 0.08);
        box-shadow: var(--shadow);
        overflow: hidden;
        position: relative;
      }
      .app-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 24px 20px 14px;
        background: var(--panel);
      }
      .eyebrow {
        margin: 0 0 4px;
        color: var(--mint-strong);
        font-size: 12px;
        font-weight: 800;
      }
      .icon-button, .small-button, .primary-button {
        border: 0;
        border-radius: 8px;
        min-height: 42px;
        font-weight: 800;
      }
      .icon-button {
        width: 42px;
        background: #eef4f0;
        color: var(--ink);
        font-size: 22px;
      }
      .icon-button.dark { background: var(--ink); color: #fff; }
      .primary-button { padding: 0 18px; background: var(--mint-strong); color: #fff; }
      .small-button { padding: 0 12px; background: #eef4f0; color: var(--ink); }

      .status-strip {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        padding: 10px 14px 14px;
        background: var(--panel);
      }
      .status-strip div {
        padding: 12px 8px;
        border-radius: 8px;
        background: #f1f6f3;
        text-align: center;
      }
      .status-strip strong, .status-strip span { display: block; }
      .status-strip strong { font-size: 18px; }
      .status-strip span { margin-top: 2px; color: var(--muted); font-size: 12px; }

      .sync-panel {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
