<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>多人點餐系統</title>
    <style>
      :root {
        --ink: #17211b;
        --muted: #68736e;
        --line: #dce3de;
        --paper: #f8faf6;
        --panel: #fff;
        --green: #289365;
        --mint: #d7efe2;
        --gold: #f5c85b;
        --red: #a13a26;
        --red-bg: #ffe8e1;
        --shadow: 0 18px 46px rgba(24, 38, 31, .16);
      }

      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #eef5ef, #f7f5ee 48%, #e7f1f6);
        color: var(--ink);
        font-family: "Segoe UI", "Noto Sans TC", Arial, sans-serif;
      }
      button, input, textarea { font: inherit; }
      button, .upload-button {
        cursor: pointer;
        -webkit-tap-highlight-color: rgba(40,147,101,.28);
        transition: transform 80ms ease, filter 120ms ease, box-shadow 120ms ease;
      }
      button:active, .upload-button:active {
        transform: scale(.96);
        filter: brightness(.92);
        box-shadow: inset 0 0 0 999px rgba(23,33,27,.08);
      }
      button:focus-visible, .upload-button:focus-within, input:focus-visible, textarea:focus-visible {
        outline: 3px solid rgba(40,147,101,.28);
        outline-offset: 2px;
      }
      h1, h2, h3, p { margin-top: 0; }
      h1 { margin: 0; font-size: 28px; line-height: 1.05; }
      h2 { margin: 0; font-size: 21px; }
      h3 { margin-bottom: 10px; font-size: 16px; }

      .phone-shell {
        width: min(430px, 100vw);
        min-height: min(920px, 100vh);
        background: var(--paper);
        border: 1px solid rgba(23,33,27,.08);
        box-shadow: var(--shadow);
        overflow: hidden;
        position: relative;
      }
      .app-header, .status-strip, .tabs { background: var(--panel); }
      .app-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 24px 20px 14px;
      }
      .eyebrow { margin: 0 0 4px; color: var(--green); font-size: 12px; font-weight: 800; }
      .icon-button, .small-button, .primary-button, .danger-button {
        border: 0;
        border-radius: 8px;
        min-height: 42px;
        font-weight: 800;
      }
      .icon-button { width: 42px; background: #eef4f0; color: var(--ink); font-size: 22px; }
      .primary-button { padding: 0 18px; background: var(--green); color: #fff; }
      .small-button { padding: 0 12px; background: #eef4f0; color: var(--ink); }
      .danger-button { padding: 0 12px; background: var(--red-bg); color: var(--red); }

      .status-strip {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        padding: 10px 14px 14px;
      }
      .status-strip div { padding: 12px 8px; border-radius: 8px; background: #f1f6f3; text-align: center; }
      .status-strip strong, .status-strip span { display: block; }
      .status-strip span { margin-top: 2px; color: var(--muted); font-size: 12px; }

      .sync-panel {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        border-top: 1px solid var(--line);
        background: #fffaf0;
      }
      .sync-panel strong, .sync-panel span { display: block; }
      .sync-panel strong { font-size: 14px; }
      .sync-panel span { margin-top: 2px; color: var(--muted); font-size: 12px; }

      .tabs {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
        padding: 10px 10px 12px;
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        z-index: 4;
      }
      .tab {
        min-height: 38px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--muted);
        font-size: 14px;
        font-weight: 800;
      }
      .tab.is-active { background: var(--ink); color: #fff; }

      .view { display: none; padding: 18px 16px 98px; }
      .view.is-active { display: block; }
      .section-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }
      label span {
        display: block;
        margin-bottom: 6px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
      }
      input, textarea {
        width: 100%;
        min-height: 44px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        padding: 0 12px;
      }
      textarea { min-height: 72px; padding: 10px 12px; resize: vertical; }
      .form-grid { display: grid; gap: 10px; }
      .button-row { display: flex; gap: 10px; align-items: center; }
      .button-row > * { flex: 1; }
      .upload-button {
        min-height: 48px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        font-weight: 800;
      }
      .upload-button input { position: absolute; opacity: 0; pointer-events: none; }

      .menu-image-wrap {
        min-height: 220px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        display: grid;
        place-items: center;
        overflow: hidden;
      }
      .menu-image-wrap img { width: 100%; height: auto; display: block; }
      .image-placeholder { padding: 24px; color: var(--muted); text-align: center; font-weight: 700; }
      .help-text { color: var(--muted); font-size: 13px; line-height: 1.45; }

      .order-items, .orders, .summary-list { display: grid; gap: 10px; }
      .entry-card, .order-card, .summary-block {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 12px;
      }
      .entry-card {
        display: grid;
        grid-template-columns: 1fr 86px 42px;
        gap: 8px;
        align-items: end;
      }
      .entry-card textarea { grid-column: 1 / -1; min-height: 54px; }
      .person-top, .summary-row, .line-items li {
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .person-top { margin-bottom: 10px; }
      .line-items { display: grid; gap: 7px; margin: 0; padding: 0; list-style: none; }
      .line-items li, .summary-row, .note-chip { padding-top: 7px; border-top: 1px dashed var(--line); }
      .order-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
      .muted { color: var(--muted); }
      .empty-state {
        padding: 18px 14px;
        border: 1px dashed var(--line);
        border-radius: 8px;
        background: rgba(255,255,255,.65);
        color: var(--muted);
        text-align: center;
        font-weight: 700;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        min-height: 30px;
        padding: 0 10px;
        border-radius: 999px;
        background: var(--mint);
        color: #216a4e;
        font-size: 12px;
        font-weight: 800;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 18px;
        transform: translate(-50%, 120%);
        width: min(360px, calc(100vw - 32px));
        padding: 12px 14px;
        border-radius: 8px;
        background: var(--ink);
        color: #fff;
        text-align: center;
        font-weight: 800;
        opacity: 0;
        transition: 180ms ease;
        z-index: 20;
      }
      .toast.show { opacity: 1; transform: translate(-50%, 0); }
      .modal {
        position: fixed;
        inset: 0;
        display: none;
        background: rgba(0,0,0,.88);
        z-index: 30;
        overflow: auto;
      }
      .modal.show { display: block; }
      .modal img { width: 100%; height: auto; display: block; }
      .modal button { position: sticky; top: 10px; left: calc(100% - 56px); margin: 10px; z-index: 31; }
      .hidden-frame { display: none; }
      @media (max-width: 430px) {
        body { display: block; background: var(--paper); }
        .phone-shell { min-height: 100vh; border: 0; box-shadow: none; }
      }
    </style>
  </head>
  <body>
    <main class="phone-shell" aria-label="多人點餐系統">
      <header class="app-header">
        <div>
          <p class="eyebrow" id="groupLabel">訂餐團</p>
          <h1>多人點餐</h1>
        </div>
        <button class="icon-button" id="shareBtn" type="button" aria-label="複製分享網址">↗</button>
      </header>

      <section class="status-strip">
        <div><strong id="peopleCount">0</strong><span>人已點</span></div>
        <div><strong id="itemCount">0</strong><span>份餐點</span></div>
        <div><strong id="totalPrice">$0</strong><span>目前總額</span></div>
      </section>

      <section class="sync-panel">
        <div>
          <strong id="syncTitle">讀取中</strong>
          <span id="syncText">正在同步試算表</span>
        </div>
        <button class="small-button" id="refreshBtn" type="button">重新整理</button>
      </section>

      <nav class="tabs">
        <button class="tab is-active" type="button" data-view="setup">建立</button>
        <button class="tab" type="button" data-view="order">點餐</button>
        <button class="tab" type="button" data-view="mine">個人</button>
        <button class="tab" type="button" data-view="summary">統計</button>
      </nav>

      <section class="view is-active" id="view-setup">
        <div class="section-heading">
          <div><p class="eyebrow">主揪</p><h2>建立訂餐團</h2></div>
          <button class="small-button" id="copyLinkBtn" type="button">複製網址</button>
        </div>
        <div class="form-grid">
          <label><span>店名 / 訂餐團名稱</span><input id="groupTitleInput" type="text" placeholder="例如：五十嵐下午茶" /></label>
          <div class="button-row">
            <label class="upload-button"><input id="cameraInput" type="file" accept="image/*" capture="environment" />拍照</label>
            <label class="upload-button"><input id="albumInput" type="file" accept="image/*" />相簿</label>
          </div>
          <div class="menu-image-wrap" id="menuImageWrap"><div class="image-placeholder">菜單圖片會顯示在這裡。點圖片可放大。</div></div>
          <button class="primary-button" id="saveGroupBtn" type="button">儲存並產生網址</button>
          <p class="help-text">菜單圖片會壓縮後以 B64 分段存到 Google 試算表，訂單也會記錄到同一份試算表。分享網址後，大家只要看圖自己填餐點和價格。</p>
        </div>
      </section>

      <section class="view" id="view-order">
        <div class="section-heading">
          <div><p class="eyebrow">大家填寫</p><h2>我的點餐</h2></div>
          <span class="pill" id="lockStatus">開放中</span>
        </div>
        <div class="menu-image-wrap" id="orderMenuImageWrap"><div class="image-placeholder">主揪尚未上傳菜單圖片。</div></div>
        <form class="form-grid" id="orderForm">
          <label><span>名字或代號</span><input id="personName" type="text" placeholder="例如：小明、1號、A車" /></label>
          <label><span>個人備註</span><input id="personNote" type="text" placeholder="例如：一起付款、不要香菜" /></label>
          <div class="order-items" id="orderItems"></div>
          <button class="small-button" id="addItemBtn" type="button">新增一個餐點</button>
          <button class="primary-button" id="submitOrderBtn" type="submit">送出訂單</button>
        </form>
      </section>

      <section class="view" id="view-mine">
        <div class="section-heading">
          <div><p class="eyebrow">可修改</p><h2>個人訂單</h2></div>
          <span class="pill">編輯 / 刪除</span>
        </div>
        <div class="orders" id="personOrders"></div>
      </section>

      <section class="view" id="view-summary">
        <div class="section-heading">
          <div><p class="eyebrow">主揪統計</p><h2>全部統計</h2></div>
          <button class="small-button" id="copySummaryBtn" type="button">複製叫餐文字</button>
        </div>
        <div class="summary-block"><h3>依餐點統計</h3><div id="itemSummary"></div></div>
        <div class="summary-block"><h3>依個人統計</h3><div id="personSummary"></div></div>
        <div class="summary-block"><h3>備註彙整</h3><div id="noteSummary"></div></div>
      </section>
    </main>

    <div class="modal" id="imageModal"><button class="icon-button" id="closeModalBtn" type="button">×</button><img id="modalImage" alt="放大的菜單" /></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <iframe class="hidden-frame" name="uploadFrame" id="uploadFrame"></iframe>
    <script>
      const API_URL = "https://script.google.com/macros/s/AKfycbxugZM52HlLboXW9c3MIS-331D9t6CB5hA6cXHXKekcmQURmYfIoNyIsdKKFD1CZKK_Bw/exec";
      const params = new URLSearchParams(location.search);
      const state = {
        groupId: params.get("group") || crypto.randomUUID(),
        title: params.get("title") || "未命名訂餐團",
        imageUrl: "",
        imageFileId: "",
        selectedImageFile: null,
        selectedImageDataUrl: "",
        locked: false,
        orders: [],
        draftItems: [],
        editingOrderId: ""
      };

      const $ = (selector) => document.querySelector(selector);
      const $$ = (selector) => Array.from(document.querySelectorAll(selector));
      const money = (value) => `$${Number(value || 0).toLocaleString("zh-TW")}`;

      function escapeHtml(value) {
        return String(value ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
      }

      function showToast(message) {
        const toast = $("#toast");
        toast.textContent = message;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 1800);
      }

      function callApi(action, payload = {}) {
        const callback = `gasCallback_${Date.now()}_${Math.random().toString(16).slice(2)}`;
        const query = new URLSearchParams({ action, payload: JSON.stringify(payload), callback });
        return new Promise((resolve, reject) => {
          const script = document.createElement("script");
          const timer = setTimeout(() => {
            cleanup();
            reject(new Error("GAS 回應逾時"));
          }, 15000);
          function cleanup() {
            clearTimeout(timer);
            delete window[callback];
            script.remove();
          }
          window[callback] = (result) => {
            cleanup();
            result?.ok ? resolve(result) : reject(new Error(result?.message || "GAS 呼叫失敗"));
          };
          script.onerror = () => {
            cleanup();
            reject(new Error("無法連線到 GAS"));
          };
          script.src = `${API_URL}?${query.toString()}`;
          document.body.appendChild(script);
        });
      }

      function postToGas(action, payload) {
        return new Promise((resolve, reject) => {
          const requestId = `post_${Date.now()}_${Math.random().toString(16).slice(2)}`;
          const timer = setTimeout(() => {
            window.removeEventListener("message", onMessage);
            reject(new Error("上傳逾時，請換較小或較清楚的圖片"));
          }, 45000);

          function onMessage(event) {
            const data = event.data || {};
            if (data.requestId !== requestId) return;
            clearTimeout(timer);
            window.removeEventListener("message", onMessage);
            data.ok ? resolve(data) : reject(new Error(data.message || "上傳失敗"));
          }

          window.addEventListener("message", onMessage);
          const form = document.createElement("form");
          form.method = "POST";
          form.action = API_URL;
          form.target = "uploadFrame";
          form.style.display = "none";
          const input = document.createElement("textarea");
          input.name = "payload";
          input.value = JSON.stringify({ requestId, action, payload });
          form.appendChild(input);
          document.body.appendChild(form);
          form.submit();
          form.remove();
        });
      }

      function compressImage(file) {
        return new Promise((resolve, reject) => {
          const image = new Image();
          image.onload = () => {
            const maxSide = 1000;
            const scale = Math.min(1, maxSide / Math.max(image.width, image.height));
            const canvas = document.createElement("canvas");
            canvas.width = Math.round(image.width * scale);
            canvas.height = Math.round(image.height * scale);
            const ctx = canvas.getContext("2d");
            ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", .58));
          };
          image.onerror = reject;
          image.src = URL.createObjectURL(file);
        });
      }

      function shareUrl() {
        const url = new URL(location.href);
        url.searchParams.set("group", state.groupId);
        url.searchParams.set("title", state.title);
        return url.toString();
      }

      async function copyText(text, successMessage) {
        try {
          await navigator.clipboard.writeText(text);
          showToast(successMessage);
        } catch {
          window.prompt("複製這段文字", text);
          showToast("已產生文字，可手動複製");
        }
      }

      function updateUrl() {
        const url = new URL(location.href);
        url.searchParams.set("group", state.groupId);
        url.searchParams.set("title", state.title);
        history.replaceState(null, "", url.toString());
      }

      function getOrderTotal(order) {
        return order.items.reduce((sum, item) => sum + Number(item.price) * Number(item.qty), 0);
      }

      function allItemCount() {
        return state.orders.reduce((sum, order) => sum + order.items.reduce((s, item) => s + Number(item.qty), 0), 0);
      }

      function grandTotal() {
        return state.orders.reduce((sum, order) => sum + getOrderTotal(order), 0);
      }

      function updateStatus() {
        $("#groupLabel").textContent = state.title;
        $("#peopleCount").textContent = state.orders.length;
        $("#itemCount").textContent = allItemCount();
        $("#totalPrice").textContent = money(grandTotal());
        $("#syncTitle").textContent = state.imageUrl ? "已建立訂餐團" : "尚未上傳菜單";
        $("#syncText").textContent = state.imageUrl ? "可分享網址給大家點餐" : "主揪先上傳菜單圖片";
        $("#lockStatus").textContent = state.locked ? "已鎖單" : "開放中";
      }

      function renderMenuImage() {
        const src = state.selectedImageDataUrl || state.imageUrl;
        const html = src
          ? `<img src="${src}" alt="菜單圖片" data-menu-image />`
          : '<div class="image-placeholder">菜單圖片會顯示在這裡。點圖片可放大。</div>';
        $("#menuImageWrap").innerHTML = html;
        $("#orderMenuImageWrap").innerHTML = src ? `<img src="${src}" alt="菜單圖片" data-menu-image />` : '<div class="image-placeholder">主揪尚未上傳菜單圖片。</div>';
        $$("[data-menu-image]").forEach((img) => img.addEventListener("click", () => openImageModal(img.src)));
      }

      function renderDraftItems() {
        if (!state.draftItems.length) state.draftItems.push({ name: "", price: "", qty: 1, note: "" });
        $("#orderItems").innerHTML = state.draftItems.map((item, index) => `
          <div class="entry-card" data-index="${index}">
            <label><span>商品</span><input data-field="name" value="${escapeHtml(item.name)}" placeholder="例如：珍珠奶茶" /></label>
            <label><span>價格</span><input data-field="price" type="number" min="0" value="${escapeHtml(item.price)}" placeholder="55" /></label>
            <button class="danger-button" type="button" data-action="remove">×</button>
            <label><span>數量</span><input data-field="qty" type="number" min="1" value="${escapeHtml(item.qty || 1)}" /></label>
            <textarea data-field="note" placeholder="單品備註，例如：半糖去冰">${escapeHtml(item.note)}</textarea>
          </div>
        `).join("");
        $$("#orderItems .entry-card").forEach((card) => {
          const index = Number(card.dataset.index);
          card.querySelectorAll("[data-field]").forEach((input) => {
            input.addEventListener("input", () => {
              state.draftItems[index][input.dataset.field] = input.value;
              updateDraftTotalLabel();
            });
          });
          card.querySelector('[data-action="remove"]').addEventListener("click", () => {
            state.draftItems.splice(index, 1);
            renderDraftItems();
          });
        });
        updateDraftTotalLabel();
      }

      function updateDraftTotalLabel() {
        const total = state.draftItems.reduce((sum, item) => sum + Number(item.price || 0) * Number(item.qty || 1), 0);
        $("#submitOrderBtn").textContent = total ? `送出訂單 ${money(total)}` : "送出訂單";
      }

      function renderOrders() {
        if (!state.orders.length) {
          $("#personOrders").innerHTML = '<div class="empty-state">目前沒有個人訂單。</div>';
          return;
        }
        $("#personOrders").innerHTML = state.orders.map((order) => `
          <article class="order-card" data-order-id="${order.id}">
            <div class="person-top">
              <div><strong>${escapeHtml(order.person)}</strong><div class="muted">${escapeHtml(order.note || "無個人備註")}</div></div>
              <strong>${money(getOrderTotal(order))}</strong>
            </div>
            <ul class="line-items">
              ${order.items.map((item) => `<li><span>${escapeHtml(item.name)} × ${item.qty}<br><span class="muted">${escapeHtml(item.note || "")}</span></span><b>${money(Number(item.price) * Number(item.qty))}</b></li>`).join("")}
            </ul>
            <div class="order-actions">
              <button class="small-button" type="button" data-action="edit">編輯</button>
              <button class="danger-button" type="button" data-action="delete">刪除</button>
            </div>
          </article>
        `).join("");
        $$("#personOrders .order-card").forEach((card) => {
          const id = card.dataset.orderId;
          card.querySelector('[data-action="edit"]').addEventListener("click", () => editOrder(id));
          card.querySelector('[data-action="delete"]').addEventListener("click", () => deleteOrder(id));
        });
      }

      function itemSummary() {
        const map = new Map();
        state.orders.forEach((order) => {
          order.items.forEach((item) => {
            const key = item.name.trim();
            const existing = map.get(key) || { name: key, qty: 0, subtotal: 0 };
            existing.qty += Number(item.qty);
            existing.subtotal += Number(item.price) * Number(item.qty);
            map.set(key, existing);
          });
        });
        return [...map.values()];
      }

      function renderSummary() {
        const items = itemSummary();
        $("#itemSummary").innerHTML = items.length ? items.map((item) => `<div class="summary-row"><span>${escapeHtml(item.name)} × ${item.qty}</span><b>${money(item.subtotal)}</b></div>`).join("") : '<div class="empty-state">目前沒有統計資料。</div>';
        $("#personSummary").innerHTML = state.orders.length ? state.orders.map((order) => `<div class="summary-row"><span>${escapeHtml(order.person)}</span><b>${money(getOrderTotal(order))}</b></div>`).join("") : '<div class="empty-state">目前沒有個人資料。</div>';
        const notes = [];
        state.orders.forEach((order) => {
          if (order.note) notes.push(`${order.person}：${order.note}`);
          order.items.forEach((item) => { if (item.note) notes.push(`${order.person} ${item.name}：${item.note}`); });
        });
        $("#noteSummary").innerHTML = notes.length ? notes.map((note) => `<div class="note-chip">${escapeHtml(note)}</div>`).join("") : '<div class="note-chip">目前沒有備註</div>';
      }

      function renderAll() {
        $("#groupTitleInput").value = state.title;
        updateStatus();
        renderMenuImage();
        renderDraftItems();
        renderOrders();
        renderSummary();
      }

      async function loadGroup() {
        const result = await callApi("getGroupData", { groupId: state.groupId, title: state.title });
        if (result.group) {
          state.title = result.group.title || state.title;
          state.imageUrl = result.group.imageUrl || "";
          state.imageFileId = result.group.imageFileId || "";
          state.locked = Boolean(result.group.locked);
        }
        state.orders = Array.isArray(result.orders) ? result.orders : [];
      }

      async function saveGroup() {
        state.title = $("#groupTitleInput").value.trim() || state.title || "未命名訂餐團";
        updateUrl();
        const imageDataUrl = state.selectedImageFile ? await compressImage(state.selectedImageFile) : "";
        showToast("正在儲存菜單圖片");
        const result = await postToGas("saveGroup", { groupId: state.groupId, title: state.title, imageDataUrl });
        state.imageUrl = result.imageUrl || state.imageUrl;
        state.imageFileId = result.imageFileId || state.imageFileId;
        state.selectedImageDataUrl = "";
        showToast("已建立訂餐團");
        renderAll();
        copyText(shareUrl(), "分享網址已複製");
      }

      function submitOrder(event) {
        event.preventDefault();
        if (state.locked) {
          showToast("已鎖單，不能再送出");
          return;
        }
        const person = $("#personName").value.trim();
        if (!person) {
          showToast("請輸入名字");
          return;
        }
        const items = state.draftItems
          .map((item) => ({ name: String(item.name || "").trim(), price: Number(item.price || 0), qty: Number(item.qty || 1), note: String(item.note || "").trim() }))
          .filter((item) => item.name && item.price > 0);
        if (!items.length) {
          showToast("請至少輸入一個商品和價格");
          return;
        }
        const order = { id: state.editingOrderId || crypto.randomUUID(), person, note: $("#personNote").value.trim(), items };
        state.orders = state.orders.filter((entry) => entry.id !== order.id);
        state.orders.push(order);
        state.editingOrderId = "";
        state.draftItems = [];
        $("#personName").value = "";
        $("#personNote").value = "";
        renderAll();
        activateView("mine");
        showToast("訂單已送出");
        callApi("submitOrder", { groupId: state.groupId, order }).catch((error) => showToast(`背景儲存失敗：${error.message}`));
      }

      function editOrder(id) {
        const order = state.orders.find((entry) => entry.id === id);
        if (!order) return;
        state.editingOrderId = order.id;
        $("#personName").value = order.person;
        $("#personNote").value = order.note || "";
        state.draftItems = order.items.map((item) => ({ ...item }));
        renderDraftItems();
        activateView("order");
        showToast("已載入訂單，可修改後送出");
      }

      function deleteOrder(id) {
        const order = state.orders.find((entry) => entry.id === id);
        if (!order) return;
        if (!confirm(`確定刪除 ${order.person} 的訂單嗎？`)) return;
        state.orders = state.orders.filter((entry) => entry.id !== id);
        renderAll();
        showToast("訂單已刪除");
        callApi("deleteOrder", { groupId: state.groupId, orderId: id }).catch((error) => showToast(`背景刪除失敗：${error.message}`));
      }

      function summaryText() {
        const lines = [`${state.title} 叫餐統計`];
        itemSummary().forEach((item) => lines.push(`${item.name} x${item.qty}`));
        lines.push("", `總金額：${money(grandTotal())}`, "", "依個人：");
        state.orders.forEach((order) => lines.push(`${order.person} ${money(getOrderTotal(order))}`));
        const noteText = $("#noteSummary").innerText.trim();
        lines.push("", "備註：", noteText || "無");
        return lines.join("\n");
      }

      function activateView(view) {
        $$(".tab").forEach((tab) => tab.classList.toggle("is-active", tab.dataset.view === view));
        $$(".view").forEach((panel) => panel.classList.toggle("is-active", panel.id === `view-${view}`));
      }

      function openImageModal(src) {
        $("#modalImage").src = src;
        $("#imageModal").classList.add("show");
      }

      function setupEvents() {
        $$(".tab").forEach((tab) => tab.addEventListener("click", () => activateView(tab.dataset.view)));
        $("#cameraInput").addEventListener("change", (event) => handleImage(event.target.files[0]));
        $("#albumInput").addEventListener("change", (event) => handleImage(event.target.files[0]));
        $("#saveGroupBtn").addEventListener("click", () => saveGroup().catch((error) => showToast(error.message)));
        $("#copyLinkBtn").addEventListener("click", () => copyText(shareUrl(), "分享網址已複製"));
        $("#shareBtn").addEventListener("click", () => copyText(shareUrl(), "分享網址已複製"));
        $("#refreshBtn").addEventListener("click", () => loadGroup().then(renderAll).catch((error) => showToast(error.message)));
        $("#addItemBtn").addEventListener("click", () => { state.draftItems.push({ name: "", price: "", qty: 1, note: "" }); renderDraftItems(); });
        $("#orderForm").addEventListener("submit", submitOrder);
        $("#copySummaryBtn").addEventListener("click", () => copyText(summaryText(), "叫餐文字已複製"));
        $("#closeModalBtn").addEventListener("click", () => $("#imageModal").classList.remove("show"));
        $("#imageModal").addEventListener("click", (event) => { if (event.target.id === "imageModal") $("#imageModal").classList.remove("show"); });
        $("#groupTitleInput").addEventListener("input", () => { state.title = $("#groupTitleInput").value.trim() || "未命名訂餐團"; updateStatus(); updateUrl(); });
      }

      function handleImage(file) {
        if (!file) return;
        state.selectedImageFile = file;
        state.selectedImageDataUrl = URL.createObjectURL(file);
        renderMenuImage();
        showToast("已載入菜單圖片，請儲存");
      }

      async function init() {
        setupEvents();
        updateUrl();
        renderAll();
        loadGroup().then(renderAll).catch(() => renderAll());
      }

      init();
    </script>
  </body>
</html>
