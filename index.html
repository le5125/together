<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>多人點餐系統</title>
    <style>
      :root {
        --ink: #17211b;
        --muted: #66726d;
        --line: #dce3de;
        --paper: #f8faf6;
        --panel: #ffffff;
        --mint: #d7efe2;
        --mint-strong: #289365;
        --coral: #e86f51;
        --gold: #f5c85b;
        --blue: #427aa1;
        --shadow: 0 20px 50px rgba(24, 38, 31, 0.16);
      }

      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #eef5ef 0%, #f7f5ee 48%, #e7f1f6 100%);
        color: var(--ink);
        font-family: "Segoe UI", "Noto Sans TC", Arial, sans-serif;
      }
      button, input, select { font: inherit; }
      button { cursor: pointer; }
      h1, h2, h3, p { margin-top: 0; }
      h1 { margin-bottom: 0; font-size: 28px; line-height: 1.05; }
      h2 { margin-bottom: 0; font-size: 21px; }
      h3 { margin-bottom: 12px; font-size: 16px; }

      .phone-shell {
        width: min(430px, 100vw);
        min-height: min(920px, 100vh);
        background: var(--paper);
        border: 1px solid rgba(23, 33, 27, 0.08);
        box-shadow: var(--shadow);
        overflow: hidden;
        position: relative;
      }
      .app-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 24px 20px 14px;
        background: var(--panel);
      }
      .eyebrow {
        margin: 0 0 4px;
        color: var(--mint-strong);
        font-size: 12px;
        font-weight: 800;
      }
      .icon-button, .small-button, .primary-button {
        border: 0;
        border-radius: 8px;
        min-height: 42px;
        font-weight: 800;
      }
      .icon-button {
        width: 42px;
        background: #eef4f0;
        color: var(--ink);
        font-size: 22px;
      }
      .icon-button.dark { background: var(--ink); color: #fff; }
      .primary-button { padding: 0 18px; background: var(--mint-strong); color: #fff; }
      .small-button { padding: 0 12px; background: #eef4f0; color: var(--ink); }

      .status-strip {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        padding: 10px 14px 14px;
        background: var(--panel);
      }
      .status-strip div {
        padding: 12px 8px;
        border-radius: 8px;
        background: #f1f6f3;
        text-align: center;
      }
      .status-strip strong, .status-strip span { display: block; }
      .status-strip strong { font-size: 18px; }
      .status-strip span { margin-top: 2px; color: var(--muted); font-size: 12px; }

      .sync-panel {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        border-top: 1px solid var(--line);
        background: #fffaf0;
      }
      .sync-panel strong, .sync-panel span { display: block; }
      .sync-panel strong { font-size: 14px; }
      .sync-panel span { margin-top: 2px; color: var(--muted); font-size: 12px; }

      .tabs {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
        padding: 10px 10px 12px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        z-index: 4;
      }
      .tab {
        min-height: 38px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--muted);
        font-size: 14px;
        font-weight: 800;
      }
      .tab.is-active { background: var(--ink); color: #fff; }
      .view { display: none; padding: 18px 16px 98px; }
      .view.is-active { display: block; }
      .section-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        min-height: 30px;
        padding: 0 10px;
        border-radius: 999px;
        background: var(--mint);
        color: #216a4e;
        font-size: 12px;
        font-weight: 800;
      }

      .menu-photo {
        min-height: 235px;
        padding: 22px 20px;
        border-radius: 8px;
        background: linear-gradient(0deg, rgba(255,255,255,.88), rgba(255,255,255,.88)), repeating-linear-gradient(90deg, #f1e1bd 0 10px, #f7eacb 10px 20px);
        border: 1px solid #e5d4aa;
        box-shadow: 0 12px 22px rgba(94, 77, 41, 0.12);
        transform: rotate(-0.7deg);
      }
      .photo-topline {
        width: 44px;
        height: 5px;
        margin-bottom: 12px;
        border-radius: 999px;
        background: var(--coral);
      }
      .menu-photo h3 { font-size: 28px; }
      .photo-row, .editor-row, .summary-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .photo-row {
        padding: 9px 0;
        border-top: 1px dashed #cfbc91;
        font-size: 18px;
      }
      .upload-panel {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin: 16px 0;
      }
      .upload-button {
        min-height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        font-weight: 800;
      }
      .upload-button input { position: absolute; opacity: 0; pointer-events: none; }
      .camera-icon { color: var(--blue); font-size: 18px; }
      .editable-list, .order-list, .person-orders, .serve-list { display: grid; gap: 10px; }
      .editor-row, .order-card, .person-card, .summary-block, .serve-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }
      .editor-row { padding: 12px; }
      .editor-row input {
        width: 100%;
        min-height: 38px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: #f4f7f4;
        padding: 0 10px;
      }
      .editor-row input.price-input { max-width: 86px; text-align: right; }
      .add-form, .person-form { display: grid; gap: 10px; }
      .add-form { grid-template-columns: 1fr 86px 42px; margin-top: 12px; }
      .add-form input, .person-form input, .option-note {
        width: 100%;
        min-height: 44px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 0 12px;
      }
      .person-form { margin-bottom: 16px; }
      .person-form label span {
        display: block;
        margin-bottom: 6px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 800;
      }
      .category-filter { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; }
      .category-filter button {
        flex: 0 0 auto;
        min-height: 36px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--panel);
        color: var(--muted);
        font-weight: 800;
      }
      .category-filter button.is-active {
        background: #fff5dc;
        border-color: #edc556;
        color: #7a5a00;
      }
      .order-card { padding: 14px; }
      .order-main {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 14px;
        align-items: start;
      }
      .order-name { display: flex; gap: 8px; align-items: center; font-weight: 900; }
      .tag {
        padding: 3px 7px;
        border-radius: 999px;
        background: #eef4f0;
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
      }
      .order-price { margin-top: 4px; color: var(--muted); font-size: 13px; }
      .stepper {
        display: grid;
        grid-template-columns: 34px 34px 34px;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }
      .stepper button { height: 34px; border: 0; background: #f3f6f3; font-size: 18px; }
      .stepper span { text-align: center; font-weight: 900; }
      .option-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
      .option-row select {
        min-height: 38px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        padding: 0 8px;
      }
      .option-note { margin-top: 8px; }
      .sticky-action {
        position: fixed;
        left: 50%;
        bottom: 14px;
        width: min(398px, calc(100vw - 28px));
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px;
        border: 1px solid rgba(23, 33, 27, 0.12);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 16px 40px rgba(23, 33, 27, 0.18);
        z-index: 6;
      }
      .sticky-action span { display: block; color: var(--muted); font-size: 12px; font-weight: 800; }
      .sticky-action strong { font-size: 20px; }
      .person-card, .serve-card { padding: 14px; }
      .person-top { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
      .person-top strong { font-size: 18px; }
      .muted { color: var(--muted); }
      .line-items { display: grid; gap: 7px; margin: 0; padding: 0; list-style: none; }
      .line-items li {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding-top: 7px;
        border-top: 1px dashed var(--line);
      }
      .summary-block { padding: 14px; margin-bottom: 12px; }
      .summary-row { padding: 9px 0; border-top: 1px dashed var(--line); }
      .note-chip { padding: 10px 0; border-top: 1px dashed var(--line); color: var(--muted); }
      .serve-card { border-left: 5px solid var(--gold); }
      .serve-card:nth-child(even) { border-left-color: var(--blue); }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 18px;
        transform: translate(-50%, 120%);
        width: min(360px, calc(100vw - 32px));
        padding: 12px 14px;
        border-radius: 8px;
        background: var(--ink);
        color: #fff;
        text-align: center;
        font-weight: 800;
        opacity: 0;
        transition: 180ms ease;
        z-index: 10;
      }
      .toast.show { opacity: 1; transform: translate(-50%, 0); }
      @media (max-width: 430px) {
        body { display: block; background: var(--paper); }
        .phone-shell { min-height: 100vh; border: 0; box-shadow: none; }
      }
    </style>
  </head>
  <body>
    <main class="phone-shell" aria-label="多人點餐系統手機版">
      <header class="app-header">
        <div>
          <p class="eyebrow" id="groupLabel">點餐團</p>
          <h1>多人點餐</h1>
        </div>
        <button class="icon-button" id="shareBtn" type="button" aria-label="複製分享網址" title="複製分享網址">↗</button>
      </header>

      <section class="status-strip" aria-label="點餐狀態">
        <div><strong id="peopleCount">0</strong><span>人已點</span></div>
        <div><strong id="itemCount">0</strong><span>份餐點</span></div>
        <div><strong id="totalPrice">$0</strong><span>目前總額</span></div>
      </section>

      <section class="sync-panel">
        <div>
          <strong id="syncTitle">連線中</strong>
          <span id="syncText">正在讀取 Google 試算表</span>
        </div>
        <button class="small-button" id="refreshBtn" type="button">重新整理</button>
      </section>

      <nav class="tabs" aria-label="主要流程">
        <button class="tab is-active" type="button" data-view="import">菜單</button>
        <button class="tab" type="button" data-view="order">點餐</button>
        <button class="tab" type="button" data-view="mine">個人</button>
        <button class="tab" type="button" data-view="summary">統計</button>
        <button class="tab" type="button" data-view="serve">分餐</button>
      </nav>

      <section class="view is-active" id="view-import">
        <div class="section-heading">
          <div><p class="eyebrow">Step 1</p><h2>匯入菜單</h2></div>
          <button class="small-button" id="saveMenuBtn" type="button">儲存菜單</button>
        </div>
        <div class="menu-photo" id="menuPhoto" role="img" aria-label="菜單照片預覽">
          <div class="photo-topline"></div>
          <h3>阿海便當</h3>
          <div class="photo-row"><span>雞腿飯</span><b>120</b></div>
          <div class="photo-row"><span>排骨飯</span><b>110</b></div>
          <div class="photo-row"><span>滷肉飯</span><b>75</b></div>
          <div class="photo-row"><span>紅茶</span><b>30</b></div>
        </div>
        <div class="upload-panel">
          <label class="upload-button">
            <input id="imageInput" type="file" accept="image/*" capture="environment" />
            <span class="camera-icon" aria-hidden="true">▣</span>
            <span>拍照或選相簿</span>
          </label>
          <button class="primary-button" id="mockOcrBtn" type="button">模擬 OCR 辨識</button>
        </div>
        <div class="editable-list" id="menuEditor" aria-label="辨識後菜單"></div>
        <form class="add-form" id="addItemForm">
          <input id="newItemName" type="text" placeholder="新增餐點名稱" aria-label="新增餐點名稱" />
          <input id="newItemPrice" type="number" min="0" placeholder="價格" aria-label="價格" />
          <button class="icon-button dark" type="submit" aria-label="新增餐點" title="新增餐點">＋</button>
        </form>
      </section>

      <section class="view" id="view-order">
        <div class="section-heading">
          <div><p class="eyebrow">Step 2</p><h2>替誰點餐</h2></div>
          <button class="small-button" id="lockBtn" type="button">開放中</button>
        </div>
        <form class="person-form" id="personForm">
          <label><span>名字或代號</span><input id="personName" type="text" value="4號" placeholder="例如：1號、小明、A車" /></label>
          <label><span>個人備註</span><input id="personNote" type="text" placeholder="例如：不要香菜、跟小美一起付" /></label>
        </form>
        <div class="category-filter" id="categoryFilter" aria-label="餐點分類"></div>
        <div class="order-list" id="orderList" aria-label="餐點列表"></div>
        <div class="sticky-action">
          <div><span>這位點餐</span><strong id="draftTotal">$0</strong></div>
          <button class="primary-button" id="submitOrderBtn" type="button">確定送出</button>
        </div>
      </section>

      <section class="view" id="view-mine">
        <div class="section-heading">
          <div><p class="eyebrow">Step 3</p><h2>個人訂單</h2></div>
          <button class="small-button" id="editLastBtn" type="button">編輯最後一筆</button>
        </div>
        <div class="person-orders" id="personOrders"></div>
      </section>

      <section class="view" id="view-summary">
        <div class="section-heading">
          <div><p class="eyebrow">主揪視角</p><h2>統計叫餐</h2></div>
          <button class="small-button" id="copySummaryBtn" type="button">複製文字</button>
        </div>
        <div class="summary-block"><h3>依餐點統計</h3><div id="itemSummary"></div></div>
        <div class="summary-block"><h3>備註彙整</h3><div id="noteSummary"></div></div>
      </section>

      <section class="view" id="view-serve">
        <div class="section-heading">
          <div><p class="eyebrow">餐點抵達</p><h2>依人分餐</h2></div>
          <span class="pill">現場用</span>
        </div>
        <div class="serve-list" id="serveList"></div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
      const API_URL = "https://script.google.com/macros/s/AKfycbxugZM52HlLboXW9c3MIS-331D9t6CB5hA6cXHXKekcmQURmYfIoNyIsdKKFD1CZKK_Bw/exec";
      const GROUP_ID = new URLSearchParams(location.search).get("group") || "demo";
      const GROUP_TITLE = new URLSearchParams(location.search).get("title") || "午餐團";
      const ALL = "全部";
      const DEFAULT_OPTION = "正常";

      const state = {
        locked: false,
        activeCategory: ALL,
        menu: [
          { id: "m1", name: "雞腿飯", price: 120, category: "便當" },
          { id: "m2", name: "排骨飯", price: 110, category: "便當" },
          { id: "m3", name: "滷肉飯", price: 75, category: "飯類" },
          { id: "m4", name: "牛肉麵", price: 145, category: "麵類" },
          { id: "m5", name: "燙青菜", price: 45, category: "小菜" },
          { id: "m6", name: "紅茶", price: 30, category: "飲料" },
          { id: "m7", name: "珍珠奶茶", price: 65, category: "飲料" }
        ],
        draft: {},
        orders: []
      };

      const $ = (selector) => document.querySelector(selector);
      const $$ = (selector) => Array.from(document.querySelectorAll(selector));
      const money = (value) => `$${Number(value || 0).toLocaleString("zh-TW")}`;

      function uid(prefix) {
        return crypto.randomUUID ? crypto.randomUUID() : `${prefix}_${Date.now()}_${Math.random().toString(16).slice(2)}`;
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function showToast(message) {
        const toast = $("#toast");
        toast.textContent = message;
        toast.classList.add("show");
        window.setTimeout(() => toast.classList.remove("show"), 1800);
      }

      async function copyText(text, successMessage) {
        try {
          await navigator.clipboard.writeText(text);
          showToast(successMessage);
        } catch {
          window.prompt("複製這段文字", text);
          showToast("已產生文字，可手動複製");
        }
      }

      function callApi(action, payload = {}) {
        const params = new URLSearchParams({
          action,
          payload: JSON.stringify(payload),
          callback: `gasCallback_${Date.now()}_${Math.random().toString(16).slice(2)}`
        });

        return new Promise((resolve, reject) => {
          const callbackName = params.get("callback");
          const script = document.createElement("script");
          const timer = window.setTimeout(() => {
            cleanup();
            reject(new Error("GAS 回應逾時"));
          }, 15000);

          function cleanup() {
            window.clearTimeout(timer);
            delete window[callbackName];
            script.remove();
          }

          window[callbackName] = (result) => {
            cleanup();
            if (result?.ok) resolve(result);
            else reject(new Error(result?.message || "GAS 呼叫失敗"));
          };

          script.onerror = () => {
            cleanup();
            reject(new Error("無法連線到 GAS"));
          };

          script.src = `${API_URL}?${params.toString()}`;
          document.body.appendChild(script);
        });
      }

      function getOrderTotal(order) {
        return order.items.reduce((sum, item) => sum + Number(item.price) * Number(item.qty), 0);
      }

      function getAllItemCount() {
        return state.orders.reduce((sum, order) => sum + order.items.reduce((itemSum, item) => itemSum + Number(item.qty), 0), 0);
      }

      function getGrandTotal() {
        return state.orders.reduce((sum, order) => sum + getOrderTotal(order), 0);
      }

      function updateStatus() {
        $("#peopleCount").textContent = state.orders.length;
        $("#itemCount").textContent = getAllItemCount();
        $("#totalPrice").textContent = money(getGrandTotal());
        $("#lockBtn").textContent = state.locked ? "已鎖單" : "開放中";
        $("#groupLabel").textContent = `${GROUP_TITLE} #${GROUP_ID}`;
        $("#syncTitle").textContent = "已連接 Google 試算表";
        $("#syncText").textContent = "送出後會寫入試算表";
      }

      function renderMenuEditor() {
        $("#menuEditor").innerHTML = state.menu.map((item) => `
          <div class="editor-row" data-id="${item.id}">
            <input class="name-input" value="${escapeHtml(item.name)}" aria-label="${escapeHtml(item.name)} 名稱" />
            <input class="price-input" type="number" value="${Number(item.price)}" min="0" aria-label="${escapeHtml(item.name)} 價格" />
          </div>
        `).join("");

        $$("#menuEditor .editor-row").forEach((row) => {
          const item = state.menu.find((entry) => entry.id === row.dataset.id);
          row.querySelector(".name-input").addEventListener("input", (event) => {
            item.name = event.target.value.trim() || item.name;
            renderOrder();
            renderSummaries();
          });
          row.querySelector(".price-input").addEventListener("input", (event) => {
            item.price = Number(event.target.value) || 0;
            renderOrder();
            renderSummaries();
          });
        });
      }

      function renderCategories() {
        const categories = [ALL, ...new Set(state.menu.map((item) => item.category || "未分類"))];
        $("#categoryFilter").innerHTML = categories.map((category) => `
          <button class="${category === state.activeCategory ? "is-active" : ""}" type="button" data-category="${escapeHtml(category)}">${escapeHtml(category)}</button>
        `).join("");
        $$("#categoryFilter button").forEach((button) => {
          button.addEventListener("click", () => {
            state.activeCategory = button.dataset.category;
            renderOrder();
          });
        });
      }

      function getVisibleMenu() {
        if (state.activeCategory === ALL) return state.menu;
        return state.menu.filter((item) => item.category === state.activeCategory);
      }

      function renderOrder() {
        renderCategories();
        $("#orderList").innerHTML = getVisibleMenu().map((item) => {
          const draft = state.draft[item.id] || { qty: 0, option: DEFAULT_OPTION, note: "" };
          return `
            <article class="order-card" data-id="${item.id}">
              <div class="order-main">
                <div>
                  <div class="order-name"><span>${escapeHtml(item.name)}</span><span class="tag">${escapeHtml(item.category || "未分類")}</span></div>
                  <div class="order-price">${money(item.price)}</div>
                </div>
                <div class="stepper" aria-label="${escapeHtml(item.name)} 數量">
                  <button type="button" data-action="minus" aria-label="減少 ${escapeHtml(item.name)}">−</button>
                  <span>${draft.qty}</span>
                  <button type="button" data-action="plus" aria-label="增加 ${escapeHtml(item.name)}">＋</button>
                </div>
              </div>
              <div class="option-row">
                <select aria-label="${escapeHtml(item.name)} 口味" data-field="option">
                  ${["正常", "小辣", "少冰", "半糖去冰", "不要蔥"].map((option) => `<option value="${option}" ${draft.option === option ? "selected" : ""}>${option}</option>`).join("")}
                </select>
                <input class="option-note" data-field="note" value="${escapeHtml(draft.note)}" placeholder="單品備註" aria-label="${escapeHtml(item.name)} 單品備註" />
              </div>
            </article>
          `;
        }).join("");

        $$(".order-card").forEach((card) => {
          const id = card.dataset.id;
          card.querySelector('[data-action="minus"]').addEventListener("click", () => setDraftQty(id, -1));
          card.querySelector('[data-action="plus"]').addEventListener("click", () => setDraftQty(id, 1));
          card.querySelector('[data-field="option"]').addEventListener("change", (event) => updateDraft(id, { option: event.target.value }));
          card.querySelector('[data-field="note"]').addEventListener("input", (event) => updateDraft(id, { note: event.target.value }));
        });

        updateDraftTotal();
      }

      function ensureDraft(id) {
        if (!state.draft[id]) state.draft[id] = { qty: 0, option: DEFAULT_OPTION, note: "" };
        return state.draft[id];
      }

      function setDraftQty(id, delta) {
        if (state.locked) {
          showToast("目前已鎖單，不能再新增");
          return;
        }
        const draft = ensureDraft(id);
        draft.qty = Math.max(0, draft.qty + delta);
        renderOrder();
      }

      function updateDraft(id, patch) {
        Object.assign(ensureDraft(id), patch);
        updateDraftTotal();
      }

      function updateDraftTotal() {
        const total = Object.entries(state.draft).reduce((sum, [id, draft]) => {
          const item = state.menu.find((entry) => entry.id === id);
          return sum + (item ? Number(item.price) * Number(draft.qty) : 0);
        }, 0);
        $("#draftTotal").textContent = money(total);
      }

      async function saveMenu() {
        await callApi("saveMenu", { groupId: GROUP_ID, title: GROUP_TITLE, menu: state.menu });
        showToast("菜單已存到試算表");
      }

      async function submitOrder() {
        if (state.locked) {
          showToast("主揪已鎖單");
          return;
        }

        const items = Object.entries(state.draft).filter(([, draft]) => draft.qty > 0).map(([id, draft]) => {
          const item = state.menu.find((entry) => entry.id === id);
          return { menuId: id, name: item.name, price: Number(item.price), qty: Number(draft.qty), option: draft.option, note: draft.note.trim() };
        });

        if (!items.length) {
          showToast("請先選餐點");
          return;
        }

        const person = $("#personName").value.trim() || `${state.orders.length + 1}號`;
        const order = { id: uid("order"), person, note: $("#personNote").value.trim(), items };
        await callApi("submitOrder", { groupId: GROUP_ID, title: GROUP_TITLE, order });
        state.orders.push(order);
        state.draft = {};
        $("#personName").value = `${state.orders.length + 1}號`;
        $("#personNote").value = "";
        renderAll();
        activateView("mine");
        showToast(`${person} 的餐點已送出`);
      }

      function renderPersonOrders() {
        $("#personOrders").innerHTML = state.orders.map((order) => `
          <article class="person-card">
            <div class="person-top">
              <div><strong>${escapeHtml(order.person)}</strong><div class="muted">${escapeHtml(order.note || "無個人備註")}</div></div>
              <strong>${money(getOrderTotal(order))}</strong>
            </div>
            <ul class="line-items">
              ${order.items.map((item) => `
                <li><span>${escapeHtml(item.name)} × ${item.qty}<br><span class="muted">${escapeHtml([item.option, item.note].filter(Boolean).join("，"))}</span></span><b>${money(Number(item.price) * Number(item.qty))}</b></li>
              `).join("")}
            </ul>
          </article>
        `).join("");
      }

      function getItemSummary() {
        const summary = new Map();
        state.orders.forEach((order) => {
          order.items.forEach((item) => {
            const key = `${item.name}|${item.option || DEFAULT_OPTION}`;
            const existing = summary.get(key) || { name: item.name, option: item.option || DEFAULT_OPTION, qty: 0, subtotal: 0 };
            existing.qty += Number(item.qty);
            existing.subtotal += Number(item.price) * Number(item.qty);
            summary.set(key, existing);
          });
        });
        return Array.from(summary.values());
      }

      function renderSummaries() {
        $("#itemSummary").innerHTML = getItemSummary().map((item) => `
          <div class="summary-row"><span>${escapeHtml(item.name)} × ${item.qty}<br><span class="muted">${escapeHtml(item.option)}</span></span><b>${money(item.subtotal)}</b></div>
        `).join("");

        const notes = [];
        state.orders.forEach((order) => {
          if (order.note) notes.push(`${order.person}：${order.note}`);
          order.items.forEach((item) => {
            if (item.note) notes.push(`${order.person} ${item.name}：${item.note}`);
          });
        });
        $("#noteSummary").innerHTML = notes.length ? notes.map((note) => `<div class="note-chip">${escapeHtml(note)}</div>`).join("") : '<div class="note-chip">目前沒有備註</div>';
      }

      function renderServeList() {
        $("#serveList").innerHTML = state.orders.map((order) => `
          <article class="serve-card">
            <div class="person-top"><strong>${escapeHtml(order.person)}</strong><span class="pill">${order.items.reduce((sum, item) => sum + Number(item.qty), 0)} 份</span></div>
            <ul class="line-items">
              ${order.items.map((item) => `
                <li><span>${escapeHtml(item.name)} × ${item.qty}<br><span class="muted">${escapeHtml([item.option, item.note].filter(Boolean).join("，"))}</span></span><b>${money(Number(item.price) * Number(item.qty))}</b></li>
              `).join("")}
            </ul>
          </article>
        `).join("");
      }

      function getSummaryText() {
        const lines = ["叫餐統計"];
        getItemSummary().forEach((item) => lines.push(`${item.name} ${item.option} x${item.qty}`));
        lines.push("", `總金額：${money(getGrandTotal())}`, "", "備註：");
        lines.push($("#noteSummary").innerText.trim() || "無");
        return lines.join("\n");
      }

      async function loadRemoteData() {
        const result = await callApi("getGroupData", { groupId: GROUP_ID, title: GROUP_TITLE });
        if (Array.isArray(result.menu) && result.menu.length) state.menu = result.menu;
        if (Array.isArray(result.orders)) state.orders = result.orders;
        state.locked = Boolean(result.group?.locked);
      }

      async function refreshData() {
        try {
          await loadRemoteData();
          renderAll();
          showToast("資料已更新");
        } catch (error) {
          showToast(error.message);
        }
      }

      async function toggleLock() {
        state.locked = !state.locked;
        updateStatus();
        try {
          await callApi("lockGroup", { groupId: GROUP_ID, title: GROUP_TITLE, locked: state.locked });
          showToast(state.locked ? "已鎖單，準備叫餐" : "已重新開放點餐");
        } catch (error) {
          state.locked = !state.locked;
          updateStatus();
          showToast(error.message);
        }
      }

      function activateView(view) {
        $$(".tab").forEach((tab) => tab.classList.toggle("is-active", tab.dataset.view === view));
        $$(".view").forEach((panel) => panel.classList.toggle("is-active", panel.id === `view-${view}`));
      }

      function renderAll() {
        renderMenuEditor();
        renderOrder();
        renderPersonOrders();
        renderSummaries();
        renderServeList();
        updateStatus();
      }

      function setupEvents() {
        $$(".tab").forEach((tab) => tab.addEventListener("click", () => activateView(tab.dataset.view)));
        $("#mockOcrBtn").addEventListener("click", () => {
          state.menu = [
            { id: "m1", name: "雞腿飯", price: 120, category: "便當" },
            { id: "m2", name: "排骨飯", price: 110, category: "便當" },
            { id: "m3", name: "滷肉飯", price: 75, category: "飯類" },
            { id: "m4", name: "牛肉麵", price: 145, category: "麵類" },
            { id: "m5", name: "燙青菜", price: 45, category: "小菜" },
            { id: "m6", name: "紅茶", price: 30, category: "飲料" },
            { id: "m7", name: "珍珠奶茶", price: 65, category: "飲料" },
            { id: "m8", name: "豆干海帶", price: 40, category: "小菜" }
          ];
          renderAll();
          showToast("已產生可編輯菜單");
        });

        $("#imageInput").addEventListener("change", (event) => {
          const file = event.target.files[0];
          if (!file) return;
          const url = URL.createObjectURL(file);
          $("#menuPhoto").style.background = `linear-gradient(rgba(255,255,255,.22), rgba(255,255,255,.22)), url("${url}") center / cover`;
          showToast("圖片已載入，先用模擬 OCR 產生餐點");
        });

        $("#addItemForm").addEventListener("submit", (event) => {
          event.preventDefault();
          const name = $("#newItemName").value.trim();
          const price = Number($("#newItemPrice").value);
          if (!name) {
            showToast("請輸入餐點名稱");
            return;
          }
          state.menu.push({ id: uid("menu"), name, price: price || 0, category: "新增" });
          $("#newItemName").value = "";
          $("#newItemPrice").value = "";
          renderAll();
        });

        $("#saveMenuBtn").addEventListener("click", async () => {
          try { await saveMenu(); } catch (error) { showToast(error.message); }
        });
        $("#submitOrderBtn").addEventListener("click", async () => {
          try { await submitOrder(); } catch (error) { showToast(error.message); }
        });
        $("#lockBtn").addEventListener("click", toggleLock);
        $("#refreshBtn").addEventListener("click", refreshData);
        $("#copySummaryBtn").addEventListener("click", () => copyText(getSummaryText(), "叫餐文字已複製"));
        $("#shareBtn").addEventListener("click", () => copyText(location.href, "分享網址已複製"));
        $("#editLastBtn").addEventListener("click", () => {
          const last = state.orders.at(-1);
          if (!last) return;
          $("#personName").value = last.person;
          $("#personNote").value = last.note;
          state.draft = {};
          last.items.forEach((item) => {
            state.draft[item.menuId] = { qty: item.qty, option: item.option, note: item.note };
          });
          state.orders = state.orders.filter((order) => order.id !== last.id);
          renderAll();
          activateView("order");
          showToast("已載入最後一筆，可修改後再送出");
        });
      }

      async function init() {
        setupEvents();
        try {
          await loadRemoteData();
        } catch (error) {
          showToast(error.message);
        }
        renderAll();
      }

      init();
    </script>
  </body>
</html>
