<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>多人點餐系統</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="phone-shell" aria-label="多人點餐系統手機版">
      <header class="app-header">
        <div>
          <p class="eyebrow" id="groupLabel">點餐團</p>
          <h1>多人點餐</h1>
        </div>
        <button class="icon-button" id="shareBtn" type="button" aria-label="複製分享網址" title="複製分享網址">
          <span aria-hidden="true">↗</span>
        </button>
      </header>

      <section class="status-strip" aria-label="點餐狀態">
        <div>
          <strong id="peopleCount">0</strong>
          <span>人已點</span>
        </div>
        <div>
          <strong id="itemCount">0</strong>
          <span>份餐點</span>
        </div>
        <div>
          <strong id="totalPrice">$0</strong>
          <span>目前總額</span>
        </div>
      </section>

      <section class="sync-panel">
        <div>
          <strong id="syncTitle">本機示範模式</strong>
          <span id="syncText">填入 GAS 網址後會寫入 Google 試算表</span>
        </div>
        <button class="small-button" id="refreshBtn" type="button">重新整理</button>
      </section>

      <nav class="tabs" aria-label="主要流程">
        <button class="tab is-active" type="button" data-view="import">菜單</button>
        <button class="tab" type="button" data-view="order">點餐</button>
        <button class="tab" type="button" data-view="mine">個人</button>
        <button class="tab" type="button" data-view="summary">統計</button>
        <button class="tab" type="button" data-view="serve">分餐</button>
      </nav>

      <section class="view is-active" id="view-import" aria-labelledby="importTitle">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Step 1</p>
            <h2 id="importTitle">匯入菜單</h2>
          </div>
          <button class="small-button" id="saveMenuBtn" type="button">儲存菜單</button>
        </div>

        <div class="menu-photo" id="menuPhoto" role="img" aria-label="菜單照片預覽">
          <div class="photo-topline"></div>
          <h3>阿海便當</h3>
          <div class="photo-row"><span>雞腿飯</span><b>120</b></div>
          <div class="photo-row"><span>排骨飯</span><b>110</b></div>
          <div class="photo-row"><span>滷肉飯</span><b>75</b></div>
          <div class="photo-row"><span>紅茶</span><b>30</b></div>
        </div>

        <div class="upload-panel">
          <label class="upload-button">
            <input id="imageInput" type="file" accept="image/*" capture="environment" />
            <span class="camera-icon" aria-hidden="true">▣</span>
            <span>拍照或選相簿</span>
          </label>
          <button class="primary-button" id="mockOcrBtn" type="button">模擬 OCR 辨識</button>
        </div>

        <div class="editable-list" id="menuEditor" aria-label="辨識後菜單"></div>

        <form class="add-form" id="addItemForm">
          <input id="newItemName" type="text" placeholder="新增餐點名稱" aria-label="新增餐點名稱" />
          <input id="newItemPrice" type="number" min="0" placeholder="價格" aria-label="價格" />
          <button class="icon-button dark" type="submit" aria-label="新增餐點" title="新增餐點">＋</button>
        </form>
      </section>

      <section class="view" id="view-order" aria-labelledby="orderTitle">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Step 2</p>
            <h2 id="orderTitle">替誰點餐</h2>
          </div>
          <button class="small-button" id="lockBtn" type="button">開放中</button>
        </div>

        <form class="person-form" id="personForm">
          <label>
            <span>名字或代號</span>
            <input id="personName" type="text" value="4號" placeholder="例如：1號、小明、A車" />
